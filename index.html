<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <title>NFT Preview Card Component</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <article class="card">
      <div class="card-image-wrapper">
        <img src="image-equilibrium.jpg" alt="Equilibrium NFT" class="card-image" />
        <div class="overlay">
          <img src="icon-view.svg" alt="Ícone de visualização" />
        </div>
      </div>
      <h2 class="card-title">Equilibrium #3429</h2>
      <p class="card-description">Our Equilibrium collection promotes balance and calm.</p>
      <div class="card-info">
        <span class="price"><img src="icon-ethereum.svg" alt="ETH" /> 0.041 ETH</span>
        <span class="time-left"><img src="icon-clock.svg" alt="Relógio" /> 3 days left</span>
      </div>
      <hr class="divider" />
      <footer class="card-author">
        <img src="image-avatar.png" alt="Jules Wyvern" class="avatar" />
        <p>Creation of <a href="#">Jules Wyvern</a></p>
      </footer>
    </article>
  </main>
</body>
</html>
