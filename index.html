<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <title>NFT Gallery</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
   
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <img src="images/logo.png" alt="NFT Gallery Logo" class="logo" />
                <span class="brand-title">NFT<span class="highlight">HUB</span></span>
            </div>
            
        </div>
    </header>

    <main class="container">
        <section class="card-list">
            <!-- Card 1 -->
            <article class="card animate__animated animate__fadeInUp">
                <div class="card-image-wrapper">
                    <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT" class="card-image" />
                    <div class="overlay"><img src="icon-view.svg" alt="Ícone de visualização" /></div>
                </div>
                <h2 class="card-title">Roan d'arc</h2>
                <p class="card-description">Chappell roan de Joana d'Arc.</p>
                <div class="card-info">
                    <span class="price"><img src="images/icon-ethereum.svg" alt="ETH" /> 0.041 ETH</span>
                    <span class="time-left"><img src="images/icon-clock.svg" alt="Relógio" /> 3 days left</span>
                </div>
                <hr class="divider" />
                <footer class="card-author">
                    <img src="image-avatar.png" alt="Ygona" class="avatar" />
                    <p>Creation of <a href="#">Moura</a></p>
                </footer>
            </article>


            <article class="card animate__animated animate__fadeInUp animate__delay-1s">
                <div class="card-image-wrapper">
                    <img src="images/image-nft-2.jpg" alt="Cyber Sphere NFT" class="card-image" />
                    <div class="overlay"><img src="images/icon-view.svg" alt="Ícone de visualização" /></div>
                </div>
                <h2 class="card-title">Casual</h2>
                <p class="card-description">Chappell roan cantando casual.</p>
                <div class="card-info">
                    <span class="price"><img src="icon-ethereum.svg" alt="ETH" /> 0.095 ETH</span>
                    <span class="time-left"><img src="icon-clock.svg" alt="Relógio" /> 1 day left</span>
                </div>
                <hr class="divider" />
                <footer class="card-author">
                    <img src="images/image-avatar.png" alt="Ygona moura" class="avatar" />
                    <p>Creation of <a href="#">Ygona moura</a></p>
                </footer>
            </article>

           
            <article class="card animate__animated animate__fadeInUp animate__delay-2s">
                <div class="card-image-wrapper">
                    <img src="images/image-nft-3.jpg" alt="Neon Crystal NFT" class="card-image" />
                    <div class="overlay"><img src="icon-view.svg" alt="Ícone de visualização" /></div>
                </div>
                <h2 class="card-title">MidWest Princess</h2>
                <p class="card-description">chappell roan em rise and fall of a midwest princess</p>
                <div class="card-info">
                    <span class="price"><img src="icon-ethereum.svg" alt="ETH" /> 0.150 ETH</span>
                    <span class="time-left"><img src="icon-clock.svg" alt="Relógio" /> 12 hours left</span>
                </div>
                <hr class="divider" />
                <footer class="card-author">
                    <img src="image-avatar.png" alt="Ygona moura" class="avatar" />
                    <p>Creation of <a href="#">Ygona</a></p>
                </footer>
            </article>
        </section>
    </main>

</body>

</html>
